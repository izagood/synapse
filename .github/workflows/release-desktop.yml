# 태그(v*)를 푸시하면 macOS(Apple Silicon·Intel 아키텍처별 .dmg)와 Windows MSI를
# GitHub Releases에 자동 업로드한다.
# 유니버설(fat) 바이너리 대신 아키텍처별로 빌드해 사용자당 다운로드 크기를 절반으로 줄인다.
# updater의 latest.json은 tauri-action이 darwin-aarch64 / darwin-x86_64 키를
# 병합 업로드하므로 자동 업데이트는 종전대로 각 아키텍처에 맞는 빌드를 받는다.
#
# 사전 준비 (1회):
#   리포지토리 Settings → Secrets and variables → Actions 에
#   SYNAPSE_GITHUB_CLIENT_ID = GitHub OAuth App의 Client ID (Device Flow 활성화)
#
# macOS 코드 서명 + 공증 (1회 준비):
#   Apple Developer Program의 "Developer ID Application" 인증서로 서명하고
#   Apple에 공증(notarize)을 받아야 사용자가 경고 없이 바로 실행할 수 있다.
#   (App Store용 "Apple Distribution" 인증서로는 DMG 직접 배포가 안 된다 —
#    반드시 Developer ID Application 이어야 한다.)
#     1. 키체인 접근에서 인증서를 개인 키와 함께 선택 → 내보내기 → .p12
#        (개인 키가 빠지면 러너에서 서명이 실패한다)
#        base64 -i developer-id.p12 | pbcopy
#     2. https://appleid.apple.com → 앱 암호(App-Specific Password) 생성
#     3. Secrets에 등록:
#        APPLE_CERTIFICATE          = (위에서 복사한 base64)
#        APPLE_CERTIFICATE_PASSWORD = .p12 내보내기 암호
#        APPLE_SIGNING_IDENTITY     = Developer ID Application: 이름 (TEAMID)
#        APPLE_ID                   = Apple 계정 이메일       (공증용)
#        APPLE_PASSWORD             = 앱 암호                 (공증용)
#        APPLE_TEAM_ID              = 10자리 팀 ID            (공증용)
#   시크릿이 없으면 ad-hoc 서명으로 빌드된다 — 배포는 되지만 Gatekeeper가
#   첫 실행을 차단하므로 릴리스에는 반드시 채워야 한다.
#
# 릴리스 방법:
#   - 자동: PR이 CI를 통과하고 main에 merge되면 auto-release.yml이 버전을 올리고
#     태그를 만든 뒤 이 워크플로를 같은 run 안에서 호출한다
#   - 수동: git tag v0.1.0 && git push origin v0.1.0
name: Release (Desktop)

on:
  push:
    tags: ["v*"]
  # auto-release.yml이 태그 ref로 호출한다
  # (GITHUB_TOKEN으로 푸시한 태그는 push 트리거를 발동시키지 않으므로)
  workflow_call:
    inputs:
      release_tag:
        description: "빌드하고 업로드할 릴리스 태그 (예: v0.4.7)"
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: write

# 같은 태그에 대한 중복 실행 방지 (예: 수동 dispatch가 겹친 경우).
# 빌드 전체의 직렬화는 auto-release.yml이 완료 대기로 담당한다 —
# 전역 그룹으로 묶으면 GitHub이 초과 pending 런을 취소해 해당 태그의 릴리스가
# 통째로 사라질 수 있으므로 여기서는 태그 단위로만 묶는다.
concurrency:
  group: release-desktop-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # Apple Silicon 네이티브, Intel은 같은 arm 러너에서 교차 컴파일한다
          # (종전 universal 빌드도 이 러너에서 x86_64를 함께 빌드해 왔으므로 검증된 경로다).
          - os: macos-14
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            artifact_note: macOS(Apple Silicon)용 설치 파일(_aarch64.dmg)입니다.
          - os: macos-14
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            artifact_note: macOS(Intel)용 설치 파일(_x64.dmg)입니다.
          - os: windows-latest
            args: ""
            rust_targets: ""
            artifact_note: Windows용 설치 파일(.msi)입니다.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets != ''
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets == ''

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Synapse MCP 사이드카를 타깃 트리플로 빌드해 externalBin 자리(src-tauri/binaries)에 둔다.
      # tauri-action 빌드가 이 바이너리를 앱 옆에 번들한다 (없으면 빌드 실패).
      - name: Synapse MCP 사이드카 빌드 (externalBin)
        shell: bash
        run: |
          set -euo pipefail
          triple="${{ matrix.rust_targets }}"
          if [ -z "$triple" ]; then triple="$(rustc -Vv | sed -n 's/^host: //p')"; fi
          echo "사이드카 타깃: $triple"
          cargo build --manifest-path crates/synapse-mcp/Cargo.toml --release --target "$triple"
          mkdir -p src-tauri/binaries
          ext=""; case "$triple" in *windows*) ext=".exe";; esac
          cp "crates/synapse-mcp/target/$triple/release/synapse-mcp$ext" \
             "src-tauri/binaries/synapse-mcp-$triple$ext"
          ls -l src-tauri/binaries

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNAPSE_GITHUB_CLIENT_ID: ${{ secrets.SYNAPSE_GITHUB_CLIENT_ID }}
          # 원클릭 업데이트 아티팩트 서명 (tauri signer로 생성한 키)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # macOS 코드 서명 — tauri-action이 .p12를 임시 키체인에 import하고
          # Hardened Runtime + entitlements.plist로 서명한다 (파일 상단 주석 참고).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # 공증 — 이 세 개가 모두 있어야 tauri가 notarytool을 돌리고 티켓을
          # staple 한다. 하나라도 비면 서명만 되고 공증은 건너뛴다.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: "Synapse ${{ inputs.release_tag || github.ref_name }}"
          releaseBody: |
            Synapse 데스크톱 설치 파일입니다.

            - macOS (Apple Silicon · M1 이상): `_aarch64.dmg` 를 받으세요.
            - macOS (Intel): `_x64.dmg` 를 받으세요.
            - Windows: `.msi` 파일을 받으세요.

            macOS 빌드는 Apple 공증을 받아 별도 우회 없이 바로 실행됩니다.
            Windows 빌드는 아직 서명되지 않아 SmartScreen 경고가 뜰 수 있습니다 — `추가 정보` → `실행`으로 진행하세요.
          releaseDraft: true
          prerelease: false
          retryAttempts: 1
          args: ${{ matrix.args }}

      # 모든 플랫폼 산출물이 draft에 업로드된 뒤에만 공개한다.
      # GitHub의 "latest" 릴리스는 생성 순서 기준이라, 빌드가 순서를 어겨 끝나면
      # 구버전이 latest가 되어 업데이터(latest.json)가 구버전을 가리킬 수 있다.
      # 이 태그가 semver 최고 버전일 때만 latest로 못 박아 순서 역전을 방지한다.
  finalize:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 산출물 검증 후 릴리스 공개
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          # REST get-by-tag(GET /releases/tags/{tag})는 draft 릴리스를 반환하지
          # 않아 404가 난다. 이 단계는 아직 draft인 릴리스를 공개하는 게 목적이므로
          # draft도 포함하는 목록 엔드포인트에서 tag_name으로 찾는다.
          # (이 잡은 checkout이 없어 git 저장소가 없으므로 git 리모트를 추론하는
          #  `gh release view` 대신, repo를 명시하는 `gh api`만 쓸 수 있다.)
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "first(.[] | select(.tag_name == \"$tag\")) | .id")
          if [ -z "$release_id" ]; then
            echo "::error::릴리스를 찾을 수 없음: $tag"
            exit 1
          fi
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "first(.[] | select(.tag_name == \"$tag\")) | .assets[].name")
          # 정확히 일치해야 하는 산출물 (Windows + 공통)
          expected=(
            "Synapse_${version}_x64-setup.exe"
            "Synapse_${version}_x64-setup.exe.sig"
            "Synapse_${version}_x64_en-US.msi"
            "Synapse_${version}_x64_en-US.msi.sig"
            "latest.json"
          )
          for asset in "${expected[@]}"; do
            if ! grep -Fxq "$asset" <<< "$assets"; then
              echo "::error::필수 릴리스 asset 누락: $asset"
              echo "현재 asset 목록:"
              printf '%s\n' "$assets"
              exit 1
            fi
          done
          # macOS 아키텍처별 산출물. arch 토큰(x64 vs x86_64)은 tauri 버전에 따라
          # 달라질 수 있어 정규식으로 검증한다. aarch64 / Intel 각각 dmg·tar.gz·sig 필요.
          mac_patterns=(
            "^Synapse_${version}_aarch64\.dmg$"
            "^Synapse_aarch64\.app\.tar\.gz$"
            "^Synapse_aarch64\.app\.tar\.gz\.sig$"
            "^Synapse_${version}_(x64|x86_64)\.dmg$"
            "^Synapse_(x64|x86_64)\.app\.tar\.gz$"
            "^Synapse_(x64|x86_64)\.app\.tar\.gz\.sig$"
          )
          for pat in "${mac_patterns[@]}"; do
            if ! grep -Eq "$pat" <<< "$assets"; then
              echo "::error::필수 macOS 릴리스 asset 누락 (패턴): $pat"
              echo "현재 asset 목록:"
              printf '%s\n' "$assets"
              exit 1
            fi
          done
          # 릴리스 본문 = 설치 안내 + 변경 내역(changelog).
          # changelog는 GitHub이 직전 릴리스 이후 머지된 PR 목록과
          # 버전 비교(Full Changelog) 링크로 자동 생성한다. previous_tag_name을
          # 생략하면 직전 릴리스 태그를 자동으로 고른다. 실패(첫 릴리스·일시 오류
          # 등)해도 설치 안내만으로 공개되도록 빈 값으로 흡수한다.
          changelog=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$tag" --jq .body 2>/dev/null) || changelog=""
          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<'EOF'
          Synapse 데스크톱 설치 파일입니다.

          - macOS: `.dmg` 파일을 받으세요. Intel/Apple Silicon 모두 지원합니다.
          - Windows: `.msi` 파일을 받으세요.

          macOS 빌드는 Apple 공증을 받아 별도 우회 없이 바로 실행됩니다.
          Windows 빌드는 아직 서명되지 않아 SmartScreen 경고가 뜰 수 있습니다 — `추가 정보` → `실행`으로 진행하세요.
          EOF
          if [ -n "$changelog" ]; then
            printf '\n%s\n' "$changelog" >> "$notes_file"
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease=false \
            -f "body=$(cat "$notes_file")" >/dev/null
          echo "릴리스 공개 완료: $tag"

          highest=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select((.draft or .prerelease) | not) | .tag_name' | sort -V | tail -1)
          if [ "$tag" = "$highest" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -f make_latest=true >/dev/null
            echo "latest → $tag"
          else
            echo "최고 버전($highest)이 아니므로 latest는 그대로 둠"
          fi
